<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>X Redirector</h1>
  <p class="hint">Redirect x.com to:</p>

  <div id="host-list"></div>
  <script src="popup.js"></script>
</body>
</html>
